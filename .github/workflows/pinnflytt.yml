name: Pinnflytt

# Målet är att alla projekt kör senaste motorn. Pinnen finns kvar — den ger
# reproducerbara bygg — men den flyttas inte längre av någon som råkar komma
# ihåg det. Varje grön merge till main öppnar en pinnflytt-PR i varje
# projekt i projekt.json.
#
# Kör efter `Prov` och inte parallellt med det: en pinne som flyttas till en
# commit vars kontroller föll är precis det pinnen fanns för att förhindra.
#
# Repot är publikt och projekten privata. Därför inget `pull_request`-
# utlösare här: en gren från en fork skulle annars kunna nå PINNFLYTT_TOKEN.
# workflow_run kör alltid med basrepots hemligheter, och bara `main` släpps
# igenom nedan.

on:
  workflow_run:
    workflows: [Prov]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinnflytt
  cancel-in-progress: false

jobs:
  lista:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      projekt: ${{ steps.las.outputs.projekt }}
      commit: ${{ steps.las.outputs.commit }}
      kort: ${{ steps.las.outputs.kort }}
      version: ${{ steps.las.outputs.version }}
      manuell: ${{ steps.las.outputs.manuell }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Den commit som faktiskt provades — inte «senaste på main», som
          # hinner bli en annan om två merger ligger tätt.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Nyckeln prövas här, en gång, och inte en gång per projekt längre
      # ner. En utgången PAT gav förut tre identiska «Bad credentials» ur
      # actions/checkout, med orsaken begravd i en logg — felet sa vad som
      # gick sönder men aldrig vad som var fel.
      - name: Pröva nyckeln
        env:
          GH_TOKEN: ${{ secrets.PINNFLYTT_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::PINNFLYTT_TOKEN saknas. Se CLAUDE.md, «Skydd och nycklar på main»." >&2
            exit 1
          fi
          svar=$(gh api -i /rate_limit 2>&1) || {
            echo "::error::PINNFLYTT_TOKEN underkänns av GitHub — förnya den. Se CLAUDE.md, «Skydd och nycklar på main». En fine-grained PAT löper ut, och kräver dessutom godkännande om organisationen begär det." >&2
            exit 1
          }
          # Varna i tid. Rubriken följer med varje autentiserat REST-svar, och
          # saknas den är det inget fel — en GitHub App-token har ingen.
          slut=$(printf '%s' "$svar" | tr -d '\r' \
            | sed -n 's/^[Gg][Ii][Tt][Hh][Uu][Bb]-[Aa]uthentication-[Tt]oken-[Ee]xpiration: *//p' | head -1)
          if [ -n "$slut" ]; then
            kvar=$(( ( $(date -d "$slut" +%s) - $(date +%s) ) / 86400 ))
            echo "PINNFLYTT_TOKEN går ut $slut ($kvar dagar kvar)."
            if [ "$kvar" -lt 21 ]; then
              echo "::warning::PINNFLYTT_TOKEN går ut om $kvar dagar ($slut). Förnya den innan pinnflytten står still."
            fi
          fi

      - id: las
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          # En ändring som bryter motorns kontrakt mot projekten ska nå
          # dem som en PR att läsa, inte som en merge inom minuter. Trailern
          # `Pinnflytt: manuell` i commit-meddelandet stänger av auto-merge
          # för just den flytten. main squash-mergas, så det är squash-
          # commitens meddelande som räknas — alltså PR-beskrivningen.
          if git log -1 --format=%B "$sha" | grep -qiE '^Pinnflytt:[[:space:]]*manuell[[:space:]]*$'; then
            manuell=ja
            echo "::notice::Commiten bär «Pinnflytt: manuell» — PR:erna öppnas utan auto-merge."
          else
            manuell=nej
          fi
          {
            echo "projekt=$(jq -c '.projekt' projekt.json)"
            echo "commit=$sha"
            echo "kort=${sha:0:7}"
            echo "version=$(jq -r .version package.json)"
            echo "manuell=$manuell"
          } >> "$GITHUB_OUTPUT"

  flytta:
    needs: lista
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        p: ${{ fromJSON(needs.lista.outputs.projekt) }}
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.p.repo }}
          token: ${{ secrets.PINNFLYTT_TOKEN }}
          path: projekt

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Flytta pinnen
        id: pin
        working-directory: projekt
        # Värdena går genom env och aldrig in i skriptets text. Ett uttryck
        # som expanderas rakt in i bash är ett skript som bara går att prova
        # genom att köra det skarpt.
        env:
          COMMIT: ${{ needs.lista.outputs.commit }}
          REPO: ${{ matrix.p.repo }}
        run: |
          set -euo pipefail
          nu=$(jq -r '(.devDependencies["@go-upstream/roadmap"] // .dependencies["@go-upstream/roadmap"]) // ""' package.json)
          if [ -z "$nu" ]; then
            echo "::notice::$REPO hämtar inte @go-upstream/roadmap — hoppas över."
            echo "gor=nej" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Två former är i bruk, och båda är giltiga npm-specar:
          #
          #   github:Go-Upstream/roadmap#<sha>
          #   https://github.com/Go-Upstream/roadmap/archive/<sha>.tar.gz
          #
          # Formen är projektets val, och en pinnflytt ska flytta hashen —
          # inte skriva om hur beroendet hämtas. Läste vi bara den ena skulle
          # den andra dessutom aldrig kännas igen som «redan aktuell», och
          # varje körning öppnade en PR som inte ändrade något i sak.
          case "$nu" in
            *'#'*)
              harva="${nu##*#}"
              ny="github:Go-Upstream/roadmap#$COMMIT" ;;
            *'/archive/'*)
              harva="${nu##*/archive/}"; harva="${harva%%.*}"
              ny="https://github.com/Go-Upstream/roadmap/archive/$COMMIT.tar.gz" ;;
            *)
              echo "::error::Okänd form på pinnen i $REPO: $nu" >&2
              exit 1 ;;
          esac
          if [ "$harva" = "$COMMIT" ]; then
            echo "::notice::$REPO ligger redan på $COMMIT."
            echo "gor=nej" >> "$GITHUB_OUTPUT"; exit 0
          fi
          falt=devDependencies
          jq -e '.devDependencies["@go-upstream/roadmap"]' package.json >/dev/null 2>&1 || falt=dependencies
          jq --arg f "$falt" --arg v "$ny" '.[$f]["@go-upstream/roadmap"] = $v' package.json > .p.json
          mv .p.json package.json
          # Låsfilen spikar den upplösta commiten. Utan den här raden bygger
          # `npm ci` vidare med den gamla motorn trots att package.json bytts.
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          {
            echo "gor=ja"
            echo "fran=$nu"
          } >> "$GITHUB_OUTPUT"

      # Motorn provas mot exempel/ i sitt eget repo, aldrig mot de tre
      # riktiga projektens konfigar. En kontraktsändring upptäcktes därför först när
      # någon körde bygget i projektet — alltså i det manuella sista steget,
      # efter att den här PR:en redan mergats. Nu byggs sidan här, med den nya
      # motorn, innan PR:en finns. Går bygget inte igenom öppnas ingen PR.
      - name: Bygg projektets roadmapsida med den nya motorn
        id: bygg
        if: steps.pin.outputs.gor == 'ja'
        working-directory: projekt
        env:
          BYGG: ${{ matrix.p.bygg }}
          REPO: ${{ matrix.p.repo }}
        run: |
          set -uo pipefail
          ok=ja
          # Byggkommandot kommer ur projekt.json och går genom env, aldrig
          # in i skriptets text — samma regel som för resten av värdena här.
          { npm ci --ignore-scripts --no-audit --no-fund && sh -c "$BYGG"; } \
            > /tmp/bygg.log 2>&1 || ok=nej
          tail -40 /tmp/bygg.log
          if [ "$ok" = nej ]; then
            echo "::error::$REPO bygger inte med motorn på den här commiten. Ingen PR öppnas — utan den här kontrollen hade pinnen gått in och gått sönder först vid publiceringen." >&2
            exit 1
          fi
          # Den byggda sidan är härledd och ska inte med i commiten. Nästa steg
          # stagear bara package.json och package-lock.json, så den blir kvar
          # som en ospårad fil på runnern och följer inte med någonstans.

      - name: Öppna eller uppdatera PR:en
        if: steps.pin.outputs.gor == 'ja'
        working-directory: projekt
        env:
          GH_TOKEN: ${{ secrets.PINNFLYTT_TOKEN }}
          COMMIT: ${{ needs.lista.outputs.commit }}
          KORT: ${{ needs.lista.outputs.kort }}
          VERSION: ${{ needs.lista.outputs.version }}
          FRAN: ${{ steps.pin.outputs.fran }}
          REPO: ${{ matrix.p.repo }}
          ARTEFAKT: ${{ matrix.p.artefakt }}
          BYGG: ${{ matrix.p.bygg }}
          AUTOMERGE: ${{ matrix.p.automerge }}
          MANUELL: ${{ needs.lista.outputs.manuell }}
        run: |
          set -euo pipefail
          gren=roadmap/pinnflytt
          bas=$(gh repo view "$REPO" --json defaultBranchRef -q .defaultBranchRef.name)

          git config user.name  "roadmap-pinnflytt"
          git config user.email "noreply@github.com"
          git switch -c "$gren"
          git add package.json package-lock.json
          git commit -m "Flytta roadmap-motorn till $KORT (v$VERSION)

          Öppnad av Pinnflytt i Go-Upstream/roadmap. Målet är att alla projekt
          kör senaste motorn; den här PR:en är hur den når hit.

          Från: $FRAN
          Till: github:Go-Upstream/roadmap#$COMMIT"
          # Grenen återanvänds, så en ny motorcommit skriver över en PR som
          # ännu inte hunnit gå in i stället för att lägga en till bredvid.
          git push --force origin "$gren"

          # Citerad heredoc: ingenting expanderas här, så bakåtfästena i
          # texten är text och inte kommandon. Värdena sätts in efteråt.
          cat > /tmp/kropp.md <<'TEXT'
          ## Vad

          Flyttar pinnen för `@go-upstream/roadmap` till [`{KORT}`](https://github.com/Go-Upstream/roadmap/commit/{COMMIT}) (v{VERSION}).

          - Från: `{FRAN}`
          - Till: `github:Go-Upstream/roadmap#{COMMIT}`

          Bara `package.json` och `package-lock.json` ändras. Låsfilen måste med — utan den bygger `npm ci` vidare med den gamla motorn trots att `package.json` bytts.

          ## Varför

          Motorn är delad mellan projekten och byggs en gång. Att alla kör den senaste är målet, inte en tillfällighet — därför öppnas den här PR:en av sig själv vid varje grön merge i motorrepot, i stället för att vänta på att någon kommer ihåg den.

          ## Efter merge

          **Sidan byggs inte om av den här PR:en.** Den publiceras för hand, så det sista steget är ditt:

          1. `{BYGG}`
          2. Publicera med Artifact-verktyget **med `url={ARTEFAKT}`** — utan `url` skapas en ny artefakt, och den länk som redan delats slutar uppdateras.

          Motorns egna kontroller (`prov`) var gröna på {KORT}, och **`{BYGG}` kördes mot just den här pinnen** innan PR:en öppnades — så sidan går att bygga. Vad som ändrats står i motorns [README](https://github.com/Go-Upstream/roadmap/blob/main/README.md).
          TEXT

          # `|` som avgränsare: hasharna och url:erna innehåller `/`, aldrig `|`.
          for p in KORT COMMIT VERSION FRAN BYGG ARTEFAKT; do
            sed -i "s|{$p}|${!p}|g" /tmp/kropp.md
          done

          # Bygglogg och fot läggs på efteråt: loggen är flerradig och går inte
          # genom en sed-substitution, och foten ska stå sist av allt.
          {
            echo
            echo "<details><summary>Byggutskriften</summary>"
            echo
            echo '```'
            tail -25 /tmp/bygg.log
            echo '```'
            echo
            echo "Varningar om källor som inte finns, eller källdokument som ändrats efter posternas fil, står här. De stoppar inte bygget — men de säger vad som hunnit bli inaktuellt sedan sidan sist byggdes."
            echo "</details>"
            if [ "$MANUELL" = ja ]; then
              echo
              echo "> **Auto-merge är avstängd för den här flytten.** Motorcommiten bär \`Pinnflytt: manuell\`, vilket den gör när ändringen rör motorns kontrakt mot projekten — fältnamn i posterna, CSS-klasser ett tema riktar sig mot, eller mallens platshållare. Läs motorns PR innan du mergar den här."
            fi
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } >> /tmp/kropp.md

          titel="Flytta roadmap-motorn till $KORT (v$VERSION)"

          # Finns PR:en redan? Frågan ställs till `gh pr list` och inte till
          # `gh pr view "$gren"`, vars utfall inte går att lita på: den föll
          # med noll utskrift på en gren som hade en öppen PR, och då gick
          # skriptet till create — som avbröt hela jobbet med «a pull request
          # for branch … already exists». Grenen återanvänds med flit, så det
          # här är den vanliga vägen och inte undantaget; att den aldrig
          # utlösts förrän nu är bara för att ingen pinnflytt hunnit hinna
          # ikapp en öppen PR tidigare.
          #
          # `pr list` svarar med data i stället för med ett utfall: numret på
          # den öppna PR:en, eller tomt. Numret är dessutom entydigt att peka
          # på i stegen efter, till skillnad från ett grennamn.
          nr=$(gh pr list --repo "$REPO" --head "$gren" --state open \
                 --json number -q '.[0].number // ""')
          ny=nej
          if [ -n "$nr" ]; then
            gh pr edit "$nr" --repo "$REPO" --title "$titel" --body-file /tmp/kropp.md
          else
            gh pr create --repo "$REPO" --base "$bas" --head "$gren" \
              --title "$titel" --body-file /tmp/kropp.md
            nr=$(gh pr list --repo "$REPO" --head "$gren" --state open \
                   --json number -q '.[0].number // ""')
            ny=ja
          fi

          if [ "$MANUELL" = ja ]; then
            # Trailern i motorcommiten väger tyngre än projektets automerge.
            # En kontraktsändring ska läsas av någon innan den når tre projekt,
            # och det beslutet hör till ändringen — inte till projektet.
            echo "::notice::«Pinnflytt: manuell» — PR:en i $REPO lämnas öppen för granskning."
          elif [ "$ny" != ja ]; then
            # **Auto-merge slås bara på när PR:en skapas, aldrig när den
            # uppdateras.** Grenen återanvänds, så en PR som hålls öppen för
            # granskning — för att den bär en kontraktsändring — pekas om till
            # nästa motorcommit av den här körningen. Bar den commiten ingen
            # trailer skulle auto-merge annars slås på här, och ändringen som
            # någon medvetet höll tillbaka gick in på köpet. Beslutet hör till
            # den flytt som öppnade PR:en; en senare bump ska inte kunna
            # eskalera det.
            echo "::notice::PR:en fanns redan i $REPO — auto-merge lämnas som den är."
          elif [ "$AUTOMERGE" = "true" ]; then
            # Faller repot saknar auto-merge påslaget: PR:en står kvar öppen,
            # vilket är rätt utfall och inte ett fel i den här körningen.
            # Numret om det finns, annars grenen: uppslaget direkt efter
            # `create` kan svara tomt innan GitHub hunnit ikapp sig själv, och
            # ett tomt argument hade blivit ett annat fel än det som råder.
            gh pr merge "${nr:-$gren}" --repo "$REPO" --squash --auto \
              || echo "::warning::Auto-merge gick inte att slå på för $REPO — PR:en står öppen."
          fi
